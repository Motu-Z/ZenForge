name: Build and Release Zentwik

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时触发
  workflow_dispatch: # 允许在 Actions 页面手动点击运行
    inputs:
      tag_name:
        description: '要发布的 Tag 名称 (例如 v1.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag_name || github.ref }} # 如果是手动触发，切换到指定的 tag

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WPF Application
      run: |
        dotnet publish Zentwik.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishSingleFile=true -o ./publish

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Zentwik-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }} # 手动触发用 input，推送触发用 ref_name
        files: ./Zentwik-win-x64.zip
        generate_release_notes: true
        # canary（can）构建必须标成预发布：GitHub 会把「最新版本」给非预发布项，
        # 一旦 can 被当成正式版，所有走 /releases/latest 的下载入口都会拿到
        # 一个尚未实机验证的构建。v2.0.0-can1 当初是手工勾的预发布，
        # v2.0.0-can2 就漏成了正式版 —— 说明靠人记得勾不可靠，写进流程里。
        prerelease: ${{ contains(github.ref_name, 'can') || contains(github.event.inputs.tag_name, 'can') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
